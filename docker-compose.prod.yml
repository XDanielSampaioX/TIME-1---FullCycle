services:
  banco:
    image: postgres:16-alpine
    container_name: rotae-db
    restart: unless-stopped
    env_file:
      - ./rotaeBackend/.env
    environment:
      POSTGRES_DB: ${DB_NAME:-rotae_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - banco_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./rotaeBackend
      dockerfile: Dockerfile.prod
    container_name: rotae-backend
    restart: unless-stopped
    env_file:
      - ./rotaeBackend/.env
    depends_on:
      banco:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./rotaeFrontend
      dockerfile: Dockerfile.prod
      args:
        API_URL: http://backend:8000
    container_name: rotae-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    build:
      context: ./rotaeNginx
      dockerfile: Dockerfile
    container_name: rotae-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./rotaeNginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - frontend
      - backend

networks:
  app-network:
    driver: bridge

volumes:
  banco_data: