events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Otimizações de performance para servir arquivos estáticos na EC2
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Compressão gzip para economizar banda e CPU
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    server {
        listen 80;

        # Cabeçalhos globais repassados para todos os serviços (Frontend e Backend)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Arquivos Estáticos do Django (Admin, DRF Spectacular, etc.)
        # Em produção, Nginx serve direto do disco com zero-copy (sendfile).
        # Em desenvolvimento ou caso o arquivo não exista no disco, faz fallback para o Django.
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files $uri @backend_fallback;
        }

        # Fallback de estáticos para o backend
        location @backend_fallback {
            proxy_pass http://backend:8000;
        }

        # Backend (API, Admin dinâmico, Swagger Docs, Healthcheck e Mídia)
        location ~ ^/(api|admin|docs|health|media)($|/) {
            proxy_pass http://backend:8000;
        }

        # Frontend Next.js (Todas as outras rotas da aplicação)
        location / {
            proxy_pass http://frontend:3000;

            # Suporte ao Hot Reload (HMR/WebSockets) do Next.js
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
