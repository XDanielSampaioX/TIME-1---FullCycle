name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.dev.yml

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Criar arquivos .env
        run: |
          cp rotaeBackend/.env.example rotaeBackend/.env
          cp rotaeFrontend/.env.example rotaeFrontend/.env

      - name: Subir os containers
        run: docker compose up --build -d --wait

      - name: Aplicar migrações
        run: docker compose exec -T backend python manage.py migrate

      - name: Lint do backend
        run: docker compose exec -T backend ruff check .

      - name: Formatação do backend
        run: docker compose exec -T backend ruff format --check .

      - name: Testes unitários do backend
        run: docker compose exec -T backend pytest -m unit

      - name: Testes de integração do backend
        run: docker compose exec -T backend pytest -m integration --cov-append --cov-fail-under=80

      - name: Lint do frontend
        run: docker compose exec -T frontend npm run lint

      - name: Testes do frontend
        run: docker compose exec -T frontend npm test

      - name: Build do frontend
        run: docker compose exec -T frontend npm run build

      - name: Mostrar logs se algo falhou
        if: failure()
        run: docker compose logs

      - name: Derrubar os containers
        if: always()
        run: docker compose down -v